name: Aetheria
version: "${version}"
main: com.aetheria.plugin.AetheriaPlugin
api-version: "1.21"
author: Aetheria
description: Ejecuta planes validados de la IA (lista blanca). La IA propone; el plugin dispone.
commands:
  aetheria:
    description: Interactua con la IA de Aetheria (conversacion, planes, NPC, servicios, cronica)
    usage: /aetheria <ask|plan|npc|servicio|cronica> ...
    permission: aetheria.use
  home:
    description: Te teletransporta a tu casa guardada
    usage: /home
    permission: aetheria.use
  sethome:
    description: Guarda tu posicion actual como casa
    usage: /sethome
    permission: aetheria.use
  balance:
    description: Muestra tu saldo
    usage: /balance
    permission: aetheria.use
  pay:
    description: Paga AET a otro jugador
    usage: /pay <jugador> <cantidad>
    permission: aetheria.use
  claim:
    description: Reclama la parcela (chunk) donde estas
    usage: /claim [info]
    permission: aetheria.use
  unclaim:
    description: Libera tu parcela actual
    usage: /unclaim
    permission: aetheria.use
permissions:
  aetheria.use:
    description: Permite usar los comandos de Aetheria
    default: true
