# ============================================================
# Override para MODO FULL LOCAL: sistema completo (lobby + main + End + mas memoria).
# NO afecta al despliegue cloud, que usa solo docker-compose.yml (modo lean).
#
#   ./scripts/gen-mc-config.ps1 -Mode full   (genera velocity con lobby y End activado)
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
#   # ...o simplemente:  ./scripts/dev-up-full.ps1
# ============================================================
name: aetheria

services:
  # Reactiva el lobby (hub de bienvenida / portales a mundos).
  lobby:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MINECRAFT_VERSION:-1.21.4}"
      ONLINE_MODE: "FALSE"   # Velocity autentica; su puerto NUNCA se publica
      MEMORY: "${LOBBY_MEMORY:-1G}"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      # Mundo VOID (vacio): no hay terreno, solo existe la sala que construye el plugin.
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: '{"layers":[],"biome":"minecraft:the_void","structure_overrides":[],"lakes":false,"features":false}'
      GENERATE_STRUCTURES: "false"
      # Hub: modo aventura forzado, paz, sin PVP ni mobs (el plugin remata: sin morir).
      MODE: "adventure"
      FORCE_GAMEMODE: "true"
      DIFFICULTY: "peaceful"
      PVP: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_ANIMALS: "false"
      SPAWN_NPCS: "false"
      SPAWN_PROTECTION: "0"
      ALLOW_NETHER: "false"
      # El plugin corre aqui con rol 'lobby' (hub + portales + protecciones).
      AETHERIA_ROLE: "lobby"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-changeme-generate-a-long-random-secret}"
    volumes:
      - ./minecraft/.generated/lobby/config:/data/config
      # Plugin Aetheria (mismo jar que main; lo genera plugin-build).
      - ./minecraft/.generated/lobby/plugins:/data/plugins
      - lobby-data:/data
    restart: unless-stopped
    networks: [aetheria-net]

  # Mundo CREATIVO: servidor Paper en modo creativo (mundo plano), backend de Velocity.
  creative:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MINECRAFT_VERSION:-1.21.4}"
      ONLINE_MODE: "FALSE"
      MEMORY: "${CREATIVE_MEMORY:-2G}"
      USE_AIKAR_FLAGS: "true"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      # Superflat clasico de hierba (bedrock + tierra + hierba) para construir.
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
      GENERATE_STRUCTURES: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_ANIMALS: "false"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      # El plugin corre aqui (rol distinto de lobby): /home + portal de vuelta al lobby.
      AETHERIA_ROLE: "creative"
      # FAWE: para pegar/guardar esquematicos del catalogo en el creativo.
      MODRINTH_PROJECTS: "fastasyncworldedit"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-changeme-generate-a-long-random-secret}"
    volumes:
      - ./minecraft/.generated/creative/config:/data/config
      - ./minecraft/.generated/creative/plugins:/data/plugins
      - creative-data:/data
    depends_on:
      plugin-build:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aetheria-net]

  # Velocity conoce lobby, main y creative (velocity.toml full) y depende de ellos.
  velocity:
    depends_on:
      - lobby
      - creative

  # 'main' con mas holgura (hay hardware local). El End se activa via el bukkit.yml
  # generado en modo full (allow-end: true), sin cambiar montajes aqui.
  main:
    environment:
      MEMORY: "${MAIN_MEMORY:-6G}"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"

volumes:
  lobby-data:
  creative-data:
