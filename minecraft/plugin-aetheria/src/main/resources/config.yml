# Configuracion del plugin Aetheria.
gateway:
  # URL del API Gateway. En la red de docker-compose es el nombre del servicio.
  url: "http://api-gateway:8080"
  # Token de servicio. Puede sobreescribirse con la variable de entorno
  # INTERNAL_SERVICE_TOKEN (recomendado en produccion).
  token: "changeme-generate-a-long-random-secret"

# NPC por defecto con el que se dirige la conversacion/planes desde los comandos.
default-npc: "arquitecto-01"

# Skins HUMANAS de los NPC (disfraz de jugador con skin via packetevents). Los modelos de jugador
# con skin pesan mas en el CLIENTE que los aldeanos vanilla: si notas FPS bajos con muchos NPC cerca,
# ponlo en false para comprobarlo (los NPC volveran a verse como aldeanos, sin tocar su comportamiento).
human-skins: true

# Mundo CREATIVO: cada bloque que coloca un jugador solo lo puede romper el mismo (o un op). Protege
# las construcciones de unos jugadores frente a otros. Ponlo en false para creativo libre.
creative-protection: true

# Rol del servidor: 'main' (por defecto) o 'lobby'. Puede sobreescribirse con la
# variable de entorno AETHERIA_ROLE (recomendado en docker-compose).
role: "main"

# En los mundos de juego (rol != lobby): portal de vuelta al lobby cerca del spawn.
return-portal:
  enabled: true
  target: "lobby"

# Solo aplica en rol 'lobby': portales fisicos del hub (cada uno a un servidor).
lobby:
  portals:
    - server: "main"
      material: "EMERALD_BLOCK"
      label: "MAIN"
    - server: "creative"
      material: "DIAMOND_BLOCK"
      label: "CREATIVO"
