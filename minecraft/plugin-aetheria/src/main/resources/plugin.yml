name: Aetheria
version: "${version}"
main: com.aetheria.plugin.AetheriaPlugin
api-version: "1.21"
author: Aetheria
description: Ejecuta planes validados de la IA (lista blanca). La IA propone; el plugin dispone.
softdepend: [FastAsyncWorldEdit, WorldEdit]
commands:
  aetheria:
    description: Interactua con la IA de Aetheria (conversacion, planes, NPC, servicios, cronica)
    usage: /aetheria <ask|plan|npc|servicio|cronica> ...
    permission: aetheria.use
  home:
    description: Te teletransporta a tu casa guardada
    usage: /home
    permission: aetheria.use
  sethome:
    description: Guarda tu posicion actual como casa
    usage: /sethome
    permission: aetheria.use
  balance:
    description: Muestra tu saldo
    usage: /balance
    permission: aetheria.use
  pay:
    description: Paga AET a otro jugador
    usage: /pay <jugador> <cantidad>
    permission: aetheria.use
  claim:
    description: Reclama una parcela (1x1, 2x2 o 3x3 chunks) comprando o alquilando
    usage: /claim [comprar|alquilar <1|2|3>|info]
    permission: aetheria.use
  unclaim:
    description: Libera tu parcela actual
    usage: /unclaim
    permission: aetheria.use
  sell:
    description: Vende al mercado el objeto de tu mano
    usage: /sell [all]
    permission: aetheria.use
  worth:
    description: Muestra cuanto vale el objeto de tu mano
    usage: /worth
    permission: aetheria.use
  shop:
    description: Muestra los precios del mercado
    usage: /shop
    permission: aetheria.use
  guia:
    description: Te da la guia de Aetheria
    usage: /guia
    permission: aetheria.use
  arquitecto:
    description: Encarga una casa a medida (asistente guiado)
    usage: /arquitecto
    permission: aetheria.use
  decorador:
    description: Decora tu parcela (jardin, farola, estatua, fuente)
    usage: /decorador
    permission: aetheria.use
  deshacer:
    description: Deshace tu ultima construccion y te devuelve casi todo el dinero
    usage: /deshacer
    permission: aetheria.use
  servicios:
    description: Guia de servicios y precios
    usage: /servicios
    permission: aetheria.use
  warp:
    description: Viaja rapido a un punto de interes
    usage: /warp <plaza|mercado|taberna|spawn>
    permission: aetheria.use
  warps:
    description: Lista los destinos de viaje rapido
    usage: /warps
    permission: aetheria.use
permissions:
  aetheria.use:
    description: Permite usar los comandos de Aetheria
    default: true
