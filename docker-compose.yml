# ============================================================
# Aetheria AI - Topologia local (Fase 0 + Fase 1)
# Levanta backend + red Minecraft en una sola maquina. Cada servicio es
# independiente: manana pueden vivir en maquinas distintas.
#
#   ./scripts/dev-up.ps1        (genera configs + arranca)
#   docker compose up -d        (requiere haber ejecutado antes gen-mc-config)
# ============================================================
name: aetheria

services:
  # ---------------- Backend (Fase 0) ----------------
  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - ai-orchestrator
    restart: unless-stopped
    networks: [aetheria-net]

  ai-orchestrator:
    build: ./services/ai-orchestrator
    env_file: .env
    ports:
      - "8090:8090"
    depends_on:
      - world-state
    restart: unless-stopped
    networks: [aetheria-net]

  # ---------------- Base de datos + World-State (Fase 2) ----------------
  # Postgres local = equivalente a Supabase en dev (mismas migraciones).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetheria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheria-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-aetheria}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetheria} -d ${POSTGRES_DB:-aetheria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [aetheria-net]

  # One-shot: aplica migraciones versionadas y termina (idempotente).
  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aetheria}:${POSTGRES_PASSWORD:-aetheria-local-dev}@postgres:5432/${POSTGRES_DB:-aetheria}
    volumes:
      - ./db/supabase/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"
    networks: [aetheria-net]

  # Read-model: resumenes estructurados del mundo (no bloques).
  world-state:
    build: ./services/world-state
    env_file: .env
    environment:
      # Sobrescribe DATABASE_URL de .env para apuntar al servicio 'postgres'.
      DATABASE_URL: postgresql://${POSTGRES_USER:-aetheria}:${POSTGRES_PASSWORD:-aetheria-local-dev}@postgres:5432/${POSTGRES_DB:-aetheria}
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aetheria-net]

  # ---------------- Red Minecraft (Fase 1) ----------------
  # Velocity: UNICO punto de entrada. Java por 25565, Bedrock por 19132 (Geyser).
  velocity:
    image: itzg/mc-proxy
    environment:
      TYPE: "VELOCITY"
      # Geyser + Floodgate para Bedrock (movil, consola). URLs oficiales v2.
      PLUGINS: >-
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity,
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity
    ports:
      - "${VELOCITY_PORT:-25565}:25565"
      - "${GEYSER_BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      # Configs generados por scripts/gen-mc-config (aportan el secreto de forwarding).
      - ./minecraft/.generated/velocity/velocity.toml:/server/velocity.toml
      - ./minecraft/.generated/velocity/forwarding.secret:/server/forwarding.secret
      - velocity-data:/server
    depends_on:
      - lobby
      - main
    restart: unless-stopped
    networks: [aetheria-net]

  # Lobby: bienvenida/portales, SIN economia. Solo accesible via Velocity.
  lobby:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"          # usar este servicio implica aceptar el EULA de Minecraft
      TYPE: "PAPER"
      VERSION: "${MINECRAFT_VERSION:-1.21.4}"
      ONLINE_MODE: "FALSE"  # Velocity autentica; su puerto NUNCA se publica
      MEMORY: "${PAPER_MEMORY:-2G}"
      USE_AIKAR_FLAGS: "true"
    volumes:
      # Directorio config completo (no un archivo suelto) para que Paper pueda escribir.
      - ./minecraft/.generated/lobby/config:/data/config
      - lobby-data:/data
    restart: unless-stopped
    networks: [aetheria-net]

  # Main: mundo persistente (economia, ciudades, IA). Solo accesible via Velocity.
  main:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MINECRAFT_VERSION:-1.21.4}"
      ONLINE_MODE: "FALSE"
      MEMORY: "${PAPER_MEMORY:-2G}"
      USE_AIKAR_FLAGS: "true"
    volumes:
      # Directorio config completo (no un archivo suelto) para que Paper pueda escribir.
      - ./minecraft/.generated/main/config:/data/config
      - main-data:/data
    restart: unless-stopped
    networks: [aetheria-net]

networks:
  aetheria-net:
    driver: bridge

volumes:
  postgres-data:
  velocity-data:
  lobby-data:
  main-data:
