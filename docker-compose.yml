# ============================================================
# Aetheria AI - Topologia local (Fase 0 + Fase 1)
# Levanta backend + red Minecraft en una sola maquina. Cada servicio es
# independiente: manana pueden vivir en maquinas distintas.
#
#   ./scripts/dev-up.ps1        (genera configs + arranca)
#   docker compose up -d        (requiere haber ejecutado antes gen-mc-config)
# ============================================================
name: aetheria

services:
  # ---------------- Backend (Fase 0) ----------------
  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    ports:
      # SOLO localhost. El plugin llega por la red interna de Docker
      # (http://api-gateway:8080), no por el host: publicar en 0.0.0.0 solo servia
      # para exponer la API a toda la LAN. Ver docs/seguridad.md.
      - "127.0.0.1:8080:8080"
    depends_on:
      - ai-orchestrator
    restart: unless-stopped
    networks: [aetheria-net]

  ai-orchestrator:
    build: ./services/ai-orchestrator
    env_file: .env
    ports:
      # SOLO localhost: las rutas /internal/* NO tienen autenticacion propia
      # (confian en que solo el gateway las alcanza). Ver docs/seguridad.md.
      - "127.0.0.1:8090:8090"
    depends_on:
      - world-state
    restart: unless-stopped
    networks: [aetheria-net]

  # ---------------- Base de datos + World-State (Fase 2) ----------------
  # Postgres local = equivalente a Supabase en dev (mismas migraciones).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetheria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheria-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-aetheria}
    ports:
      # SOLO localhost. Publicado en 0.0.0.0 la base de datos entera quedaba
      # accesible desde cualquier equipo de la red, con las credenciales del .env.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetheria} -d ${POSTGRES_DB:-aetheria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [aetheria-net]

  # One-shot: aplica migraciones versionadas y termina (idempotente).
  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aetheria}:${POSTGRES_PASSWORD:-aetheria-local-dev}@postgres:5432/${POSTGRES_DB:-aetheria}
    volumes:
      - ./db/supabase/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"
    networks: [aetheria-net]

  # Read-model: resumenes estructurados del mundo (no bloques).
  world-state:
    build: ./services/world-state
    env_file: .env
    environment:
      # Sobrescribe DATABASE_URL de .env para apuntar al servicio 'postgres'.
      DATABASE_URL: postgresql://${POSTGRES_USER:-aetheria}:${POSTGRES_PASSWORD:-aetheria-local-dev}@postgres:5432/${POSTGRES_DB:-aetheria}
      # Fase 8: cada cuanto evoluciona la economia del pueblo (segundos).
      SIM_TICK_SECONDS: "${SIM_TICK_SECONDS:-180}"
    ports:
      # SOLO localhost: read-model interno, sin autenticacion propia.
      - "127.0.0.1:8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aetheria-net]

  # ---------------- Red Minecraft (Fase 1) ----------------
  # Velocity: UNICO punto de entrada. Java por 25565, Bedrock por 19132 (Geyser).
  velocity:
    image: itzg/mc-proxy
    environment:
      TYPE: "VELOCITY"
      # Geyser + Floodgate para Bedrock (movil, consola). URLs oficiales v2.
      PLUGINS: >-
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity,
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity
    ports:
      - "${VELOCITY_PORT:-25565}:25565"
      - "${GEYSER_BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      # Configs generados por scripts/gen-mc-config (aportan el secreto de forwarding).
      - ./minecraft/.generated/velocity/velocity.toml:/server/velocity.toml
      - ./minecraft/.generated/velocity/forwarding.secret:/server/forwarding.secret
      - velocity-data:/server
    depends_on:
      - main
    restart: unless-stopped
    networks: [aetheria-net]

  # Lobby: DESACTIVADO en el arranque sin lobby (recorte Always Free 2 OCPU/12 GB).
  # Reactivar = descomentar este servicio, su volumen 'lobby-data', anadirlo al try de
  # velocity.toml y al depends_on de velocity. Ver docs/infra/fase4-oracle-handoff.md.
  # lobby:
  #   image: itzg/minecraft-server
  #   environment:
  #     EULA: "TRUE"
  #     TYPE: "PAPER"
  #     VERSION: "${MINECRAFT_VERSION:-1.21.4}"
  #     ONLINE_MODE: "FALSE"
  #     MEMORY: "${LOBBY_MEMORY:-1G}"
  #     USE_AIKAR_FLAGS: "true"
  #     VIEW_DISTANCE: "4"
  #     SIMULATION_DISTANCE: "3"
  #     SPAWN_MONSTERS: "false"
  #     SPAWN_ANIMALS: "false"
  #     SPAWN_NPCS: "false"
  #   volumes:
  #     - ./minecraft/.generated/lobby/config:/data/config
  #     - lobby-data:/data
  #   restart: unless-stopped
  #   networks: [aetheria-net]

  # One-shot: compila el plugin Java en un contenedor Gradle (sin JDK en el host ni en la
  # VM) y deja el jar en minecraft/.generated/main/plugins, que 'main' monta como plugins.
  # Asi el despliegue (local y cloud) construye el plugin con el mismo `docker compose up`.
  plugin-build:
    image: gradle:8.10.2-jdk21
    working_dir: /plugin
    environment:
      GRADLE_USER_HOME: /gradle-cache
    volumes:
      - ./minecraft/plugin-aetheria:/plugin
      - ./minecraft/.generated/main/plugins:/dist-main
      - ./minecraft/.generated/lobby/plugins:/dist-lobby
      - ./minecraft/.generated/creative/plugins:/dist-creative
      - gradle-cache:/gradle-cache
    entrypoint:
      - sh
      - -c
      - "gradle build --no-daemon -q && cp build/libs/aetheria-plugin-*.jar /dist-main/aetheria-plugin.jar && cp build/libs/aetheria-plugin-*.jar /dist-lobby/aetheria-plugin.jar && cp build/libs/aetheria-plugin-*.jar /dist-creative/aetheria-plugin.jar && echo '[plugin-build] jar copiado (main + lobby + creative)'"
    restart: "no"

  # Main: mundo persistente (economia, ciudades, IA). Solo accesible via Velocity.
  main:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MINECRAFT_VERSION:-1.21.4}"
      ONLINE_MODE: "FALSE"
      MEMORY: "${MAIN_MEMORY:-4G}"      # 4G es el punto dulce en 2 nucleos (no subir a 8G)
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "5"
      ALLOW_NETHER: "true"
      # Chunky: pregeneracion de mundos (evita tirones de generacion en caliente en la VM).
      MODRINTH_PROJECTS: "chunky"
      # El plugin Aetheria usa este token para autenticarse contra el API Gateway.
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-changeme-generate-a-long-random-secret}"
    volumes:
      # Directorio config completo (no un archivo suelto) para que Paper pueda escribir.
      - ./minecraft/.generated/main/config:/data/config
      # bukkit.yml (desactiva el End; no hay variable de entorno para ello).
      - ./minecraft/.generated/main/bukkit.yml:/data/bukkit.yml
      # Plugins: el jar lo genera el servicio one-shot 'plugin-build'.
      - ./minecraft/.generated/main/plugins:/data/plugins
      - main-data:/data
    depends_on:
      plugin-build:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aetheria-net]

networks:
  aetheria-net:
    driver: bridge

volumes:
  postgres-data:
  velocity-data:
  # lobby-data:   # reactivar junto con el servicio 'lobby'
  main-data:
  gradle-cache:
