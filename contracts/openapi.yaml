openapi: 3.1.0
info:
  title: Aetheria API Gateway
  version: 0.1.0
  description: >
    Contrato REST entre el plugin de Minecraft (Java/Paper) y el backend de Aetheria.
    El plugin NUNCA recibe comandos ejecutables directamente: recibe planes ya
    validados. El LLM nunca aparece en este contrato; queda detrás del AI Orchestrator.
servers:
  - url: http://localhost:8080
    description: Desarrollo local (docker-compose)

tags:
  - name: system
    description: Salud y metadatos
  - name: conversation
    description: Conversación con NPC (enrutado en 3 niveles)
  - name: planning
    description: Solicitud y validación de planes de acción
  - name: quests
    description: Misiones del pueblo y prestigio del jugador (de ahí sale el alcalde)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness/readiness del API Gateway
      security: []
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/conversation:
    post:
      tags: [conversation]
      summary: Enviar un mensaje a un NPC y recibir su respuesta
      description: >
        El backend decide el nivel (1=código, 2=modelo local, 3=LLM potente) antes de
        gastar tokens. El plugin no sabe qué nivel se usó.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRequest"
      responses:
        "200":
          description: Respuesta del NPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/plans:
    post:
      tags: [planning]
      summary: Solicitar un plan de acción para un actor (p.ej. un NPC arquitecto)
      description: >
        El AI Orchestrator genera un plan y el validador lo aprueba o rechaza ANTES de
        devolverlo. El plugin solo recibe planes cuyo estado es "approved" y ejecuta
        exclusivamente acciones de la lista blanca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: Plan aprobado o rechazado (con motivo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/players:
    post:
      tags: [players]
      summary: Registrar/actualizar un jugador (al entrar al servidor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerUpsert" }
      responses:
        "200":
          description: Jugador registrado
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/homes:
    put:
      tags: [players]
      summary: Guardar la casa del jugador (para un servidor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeUpsert" }
      responses:
        "200": { description: Casa guardada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/homes/{player_uuid}:
    get:
      tags: [players]
      summary: Obtener la casa del jugador en un servidor
      parameters:
        - name: player_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: server
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Casa del jugador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "404": { description: El jugador no tiene casa en ese servidor }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/balance/{player_uuid}:
    get:
      tags: [economy]
      summary: Saldo AET del jugador (crea la cuenta con saldo inicial si no existe)
      parameters:
        - name: player_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saldo del jugador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/pay:
    post:
      tags: [economy]
      summary: Transferir AET de un jugador a otro (atómico, con control de fondos)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transfer" }
      responses:
        "200":
          description: Transferencia realizada
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
        "400": { description: Fondos insuficientes o cantidad no válida }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/service:
    post:
      tags: [economy]
      summary: Contratar un servicio inteligente de PAGO (Arquitecto/Decorador/Urbanista IA)
      description: >
        La IA propone un plan a partir de la descripción, el validador lo aprueba o rechaza
        y SOLO si se aprueba se cobra el precio del servicio. Nunca se paga por un plan
        rechazado ni sin fondos. Las acciones devueltas ya están validadas (lista blanca).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequest" }
      responses:
        "200":
          description: Servicio aprobado (cobrado) o rechazado (con motivo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/world-events:
    get:
      tags: [world]
      summary: Crónica del mundo (Fase 8) — sucesos autónomos, del más reciente al más antiguo
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Lista de sucesos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorldEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/production:
    post:
      tags: [world]
      summary: >-
        Producción FÍSICA de los aldeanos (#11) — el trabajo real del pueblo (cosechas, talas,
        piedra picada, metal fundido) se convierte en ingresos de los sectores económicos.
      description: >-
        Lo envía el plugin por lotes (no bloque a bloque). El world-state abona el valor a la
        cuenta del sector correspondiente. El importe por petición está acotado en el backend:
        el plugin nunca puede inyectar dinero sin límite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Production" }
      responses:
        "200":
          description: Producción abonada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  credited: { type: number, example: 18.4 }
        "400": { description: Lote inválido }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/village/population:
    post:
      tags: [world]
      summary: Población REAL del mundo, que reporta el plugin (es quien la decide)
      description: >-
        Desde #14 el crecimiento lo decide el plugin: cada aldea ahorra en su hucha y, al cubrir
        el coste del siguiente vecino, nace o llega uno (y al revés, si la hucha entra en números
        rojos, se pierde uno). El backend ya no tira el dado: recibe el número real y lo usa para
        la economía (ingreso base y gasto por habitante).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [population]
              properties:
                world: { type: string, example: main }
                population: { type: integer, minimum: 0, example: 12 }
      responses:
        "200":
          description: Población actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  population: { type: integer, example: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/claims:
    get:
      tags: [social]
      summary: Parcelas de un mundo (Fase 9) — el plugin las cachea para proteger
      parameters:
        - name: world
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lista de parcelas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [social]
      summary: Reclamar una parcela (un chunk). Cobra en AET; valida solape y fondos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlotClaim" }
      responses:
        "200":
          description: Parcela reclamada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  price: { type: number, example: 50 }
        "400": { description: Fondos insuficientes }
        "409": { description: La parcela ya está reclamada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/claims/unclaim:
    post:
      tags: [social]
      summary: Liberar una parcela propia (por su esquina mínima)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlotUnclaim" }
      responses:
        "200": { description: Parcela liberada }
        "404": { description: No tienes una parcela ahí }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/quests:
    get:
      tags: [quests]
      summary: Misiones activas de un jugador en una aldea
      parameters:
        - name: player
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: village
          in: query
          required: true
          schema: { type: string, example: Rocavieja }
      responses:
        "200":
          description: Lista de misiones activas (las caducadas se marcan por el camino)
          content:
            application/json:
              schema:
                type: object
                properties:
                  quests:
                    type: array
                    items: { $ref: "#/components/schemas/Quest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [quests]
      summary: Registrar una misión que el plugin compuso con el estado real de la aldea
      description: >-
        El objetivo lo genera CÓDIGO (qué falta en el granero, cuánto le falta a la hucha,
        qué vecinos hay), nunca el LLM. La recompensa que llega aquí se **recorta al baremo**
        del backend por tipo de misión: el plugin propone, el backend tasa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestCreate" }
      responses:
        "200":
          description: Misión creada, rechazada (tipo desconocido) o cupo lleno
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, full, rejected] }
                  quest: { $ref: "#/components/schemas/Quest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/quests/progress:
    post:
      tags: [quests]
      summary: Sumar avance a una misión (entrega, venta, charla, aportación)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_uuid, quest_id]
              properties:
                player_uuid: { type: string, format: uuid }
                quest_id: { type: string, format: uuid }
                delta: { type: integer, minimum: 0, example: 8 }
      responses:
        "200":
          description: Progreso apuntado (no paga; solo apunta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  progress: { type: integer, example: 12 }
                  target: { type: integer, example: 20 }
                  ready: { type: boolean, example: false }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/quest/complete:
    post:
      tags: [quests]
      summary: Cobrar una misión cumplida (lo decide el backend, no el plugin)
      description: >-
        Comprueba contra la fila persistida que `progress >= target`. Solo entonces paga los
        AET (transacción atómica, como /v1/reward) y suma el prestigio en esa aldea.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_uuid, quest_id]
              properties:
                player_uuid: { type: string, format: uuid }
                quest_id: { type: string, format: uuid }
      responses:
        "200":
          description: Resultado del cobro
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, incomplete, already, not_found] }
                  reward_aet: { type: integer, example: 40 }
                  reward_prestige: { type: integer, example: 12 }
                  score: { type: integer, example: 57 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/donation:
    post:
      tags: [quests]
      summary: Aportar al arca de una aldea (cobra y suma prestigio en un solo viaje)
      description: >-
        Sustituye al `/v1/pay` que usaba el arca: mover el dinero y ganar prestigio son la
        misma transacción (o pasan las dos, o no pasa ninguna). El prestigio por donación
        crece por **raíz cuadrada**: donar 4x más no da 4x más prestigio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_uuid, village_name, amount]
              properties:
                player_uuid: { type: string, format: uuid }
                username: { type: string }
                village_name: { type: string, example: Rocavieja }
                amount: { type: number, minimum: 0.01, example: 100 }
      responses:
        "200":
          description: Aportación registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  donated_total: { type: number, example: 625 }
                  score: { type: integer, example: 37 }
        "400": { description: Fondos insuficientes o cantidad inválida }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/village/{village_name}/reputation:
    get:
      tags: [quests]
      summary: Prestigio de los JUGADORES en una aldea (ya calculado en el backend)
      description: >-
        `score = mission_points + floor(sqrt(donated_total))`. La fórmula vive aquí, no en el
        plugin, para no tenerla en dos sitios. El plugin fusiona esta lista con el peculio de
        sus aldeanos y de ahí sale el alcalde.
      parameters:
        - name: village_name
          in: path
          required: true
          schema: { type: string, example: Rocavieja }
      responses:
        "200":
          description: Jugadores con prestigio en esa aldea, de mayor a menor
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerReputation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/players/{player_uuid}/reputation:
    get:
      tags: [quests]
      summary: Prestigio de un jugador en todas las aldeas (para /prestigio)
      parameters:
        - name: player_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Una entrada por aldea donde ha dejado huella
          content:
            application/json:
              schema:
                type: object
                properties:
                  villages:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerReputation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: Token compartido servicio-a-servicio (INTERNAL_SERVICE_TOKEN)

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Cuerpo de la petición inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok], example: ok }
        service: { type: string, example: api-gateway }
        version: { type: string, example: "0.1.0" }

    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [npc, player, system] }
        id: { type: string, example: arquitecto-01 }

    ConversationRequest:
      type: object
      required: [npc_id, player_id, message]
      properties:
        npc_id: { type: string }
        player_id: { type: string }
        message: { type: string, maxLength: 2000 }
        world: { type: string, default: main }

    ConversationResponse:
      type: object
      required: [reply, level]
      properties:
        reply: { type: string }
        level:
          type: integer
          enum: [1, 2, 3]
          description: Nivel que resolvió la respuesta (1=código, 2=local, 3=LLM)

    PlanRequest:
      type: object
      required: [actor, goal]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        goal: { type: string, description: Objetivo en lenguaje natural o intent }
        world: { type: string, default: main }
        context_ref:
          type: string
          description: Id del snapshot del world-state sobre el que planificar

    PlanAction:
      type: object
      required: [type, params]
      properties:
        type:
          type: string
          description: Debe pertenecer a la lista blanca del validador
          example: PLACE_BLUEPRINT
        params:
          type: object
          additionalProperties: true

    PlanResponse:
      type: object
      required: [plan_id, status, actions, reversible]
      properties:
        plan_id: { type: string, format: uuid }
        status:
          type: string
          enum: [approved, rejected]
        rejection_reason:
          type: string
          description: Presente solo si status=rejected
        actions:
          type: array
          items: { $ref: "#/components/schemas/PlanAction" }
        reversible: { type: boolean }
        estimated_cost: { type: integer }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    PlayerUpsert:
      type: object
      required: [uuid, username]
      properties:
        uuid: { type: string, format: uuid }
        username: { type: string }

    HomeUpsert:
      type: object
      required: [uuid, server, world, x, y, z]
      properties:
        uuid: { type: string, format: uuid }
        username: { type: string }
        server: { type: string }
        world: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        yaw: { type: number, default: 0 }
        pitch: { type: number, default: 0 }

    Home:
      type: object
      required: [server, world, x, y, z, yaw, pitch]
      properties:
        server: { type: string }
        world: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        yaw: { type: number }
        pitch: { type: number }

    Balance:
      type: object
      required: [balance, currency]
      properties:
        balance: { type: number, example: 100.0 }
        currency: { type: string, example: AET }

    Transfer:
      type: object
      required: [from_uuid, to_uuid, amount]
      properties:
        from_uuid: { type: string, format: uuid }
        to_uuid: { type: string, format: uuid }
        amount: { type: number, minimum: 0, example: 25 }
        reason: { type: string }

    ServiceRequest:
      type: object
      required: [player_uuid, service, description]
      properties:
        player_uuid: { type: string, format: uuid }
        service:
          type: string
          description: Tipo de servicio (arquitecto, decorador, urbanista, ...)
          example: arquitecto
        description: { type: string, example: "construye una casa pequeña de madera" }
        world: { type: string, default: main }

    ServiceResponse:
      type: object
      required: [status, charged, actions]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          description: Presente si status=rejected (plan rechazado o fondos insuficientes)
        charged:
          type: number
          description: AET cobrados (0 si el servicio fue rechazado)
          example: 50
        actions:
          type: array
          items: { $ref: "#/components/schemas/PlanAction" }

    WorldEvent:
      type: object
      required: [kind, description, created_at]
      properties:
        kind: { type: string, example: economy }
        description: { type: string, example: "El pueblo trabajo: La Granja de Nara gano 8 AET..." }
        created_at: { type: string, format: date-time }

    Production:
      type: object
      required: [world, entries]
      properties:
        world: { type: string, example: main }
        entries:
          type: array
          description: Un apunte por sector economico (se agregan en el plugin, no van uno a uno).
          items:
            type: object
            required: [sector, value]
            properties:
              sector: { type: string, example: agricultura }
              value: { type: number, example: 12.5, description: AET producidos en el lote }
              goods: { type: string, example: "trigo x6, piedra x3" }

    PlotClaim:
      type: object
      required: [owner_uuid, world, min_x, min_z, max_x, max_z]
      properties:
        owner_uuid: { type: string, format: uuid }
        owner_name: { type: string }
        world: { type: string, example: main }
        min_x: { type: integer }
        min_z: { type: integer }
        max_x: { type: integer }
        max_z: { type: integer }

    PlotUnclaim:
      type: object
      required: [owner_uuid, world, min_x, min_z]
      properties:
        owner_uuid: { type: string, format: uuid }
        world: { type: string, example: main }
        min_x: { type: integer }
        min_z: { type: integer }

    Plot:
      type: object
      required: [world, min_x, min_z, max_x, max_z]
      properties:
        owner_uuid: { type: string, format: uuid, nullable: true }
        owner_name: { type: string, nullable: true }
        world: { type: string }
        min_x: { type: integer }
        min_z: { type: integer }
        max_x: { type: integer }
        max_z: { type: integer }

    QuestCreate:
      type: object
      required: [player_uuid, village_name, kind, target]
      properties:
        player_uuid: { type: string, format: uuid }
        username: { type: string }
        village_name: { type: string, example: Rocavieja }
        kind:
          type: string
          enum: [economica, social, construccion, mantenimiento, exploracion]
        objective:
          type: object
          description: >-
            Qué se pide, en datos (no en prosa): tipo de encargo, género, cantidad, aldea
            destino... Lo compone el plugin con el estado real; el LLM como mucho lo redacta.
          example: { type: granero, good: WHEAT, amount: 20, label: trigo }
        target: { type: integer, minimum: 1, example: 20 }
        reward_aet: { type: integer, minimum: 0, example: 40 }
        reward_prestige: { type: integer, minimum: 0, example: 12 }

    Quest:
      type: object
      required: [id, village_name, kind, progress, target]
      properties:
        id: { type: string, format: uuid }
        village_name: { type: string }
        kind: { type: string }
        objective: { type: object }
        progress: { type: integer, example: 12 }
        target: { type: integer, example: 20 }
        reward_aet: { type: integer, example: 40 }
        reward_prestige: { type: integer, example: 12 }
        status: { type: string, enum: [active, completed, expired] }

    PlayerReputation:
      type: object
      required: [score]
      properties:
        player_uuid: { type: string, format: uuid }
        username: { type: string }
        village_name: { type: string }
        mission_points: { type: integer, example: 45 }
        donated_total: { type: number, example: 625 }
        score:
          type: integer
          description: "mission_points + floor(sqrt(donated_total))"
          example: 70

security:
  - internalToken: []
